apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphostpathvolume
  annotations:
    description: Запрещает тома hostPath, то есть монтирование файловой системы узла.
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHostPathVolume
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphostpathvolume

        violation[{"msg": msg}] {
          v := input.review.object.spec.volumes[_]
          v.hostPath
          msg := sprintf("том %v: hostPath (%v) запрещен", [v.name, v.hostPath.path])
        }
