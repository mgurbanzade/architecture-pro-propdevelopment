# Запрет привилегированных контейнеров. Действует в namespace с меткой security.pd/gatekeeper=enforce (audit-zone).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPPrivilegedContainer
metadata:
  name: deny-privileged-containers
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchLabels:
        security.pd/gatekeeper: enforce
