# Сетевые политики для четырех сервисов в одном namespace.
# Трафик разрешен только внутри пар:
#   front-end        <-> back-end-api
#   admin-front-end  <-> admin-back-end-api
# Остальной входящий трафик к подам namespace запрещен политикой default-deny-ingress.
# Применение: kubectl apply -f non-admin-api-allow.yaml (в namespace, где развернуты сервисы).
# Нужен CNI с поддержкой NetworkPolicy, например: minikube start -p propdev --cni=calico
---
# 1. По умолчанию запрещаем любой входящий трафик ко всем подам namespace.
#    Новый под без разрешающей политики изолирован от остальных.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# 2. front-end -> back-end-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: back-end-api-allow-from-front-end
spec:
  podSelector:
    matchLabels:
      role: back-end-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: front-end
---
# 3. back-end-api -> front-end
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-end-allow-from-back-end-api
spec:
  podSelector:
    matchLabels:
      role: front-end
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: back-end-api
---
# 4. admin-front-end -> admin-back-end-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-back-end-api-allow-from-admin-front-end
spec:
  podSelector:
    matchLabels:
      role: admin-back-end-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: admin-front-end
---
# 5. admin-back-end-api -> admin-front-end
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-front-end-allow-from-admin-back-end-api
spec:
  podSelector:
    matchLabels:
      role: admin-front-end
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: admin-back-end-api
